services:
  postgres:
    image: postgres:16
    container_name: ravenflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ravenflow
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: ravenflow_redis
    restart: always
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: ravenflow_qdrant
    restart: always
    ports:
      - "6333:6333"